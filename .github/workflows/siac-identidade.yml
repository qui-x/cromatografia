name: "SIAC - Ícone e identidade inicial"
on:
  push:
    branches: [main, feat/siac-experiencia-didatica]
    paths:
      - "assets/siac-icone.svg"
      - "assets/siac-icone-app.svg"
      - "js/ui/abertura.js"
      - "css/siac-identidade.css"
      - "css/siac-abertura-v4.css"
      - "previews/abertura-v4.html"
      - "scripts/siac-validar-v4.cjs"
      - "index.html"
      - "scripts/siac-capturar-abertura.cjs"
      - "scripts/siac-gerar-icones.py"
      - "tests/siac-logo-png.py"
      - "tests/siac-identidade.test.cjs"
      - "tests/siac-titulo-abertura.test.cjs"
      - "tests/siac-independencia.test.cjs"
      - "tests/siac-home-browser.cjs"
      - "css/investigacao.css"
      - "js/core/namespace.js"
      - "js/init/pwa.js"
      - "sw.js"
      - "build_standalone.py"
      - ".github/workflows/siac-identidade.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identidade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar conversão SVG para PNG
        run: |
          python3 -m pip install --user --disable-pip-version-check Pillow
      - name: Gerar todos os ícones a partir do SVG
        run: python3 scripts/siac-gerar-icones.py
      - name: Verificar canal alfa real dos PNGs do PWA
        run: python3 tests/siac-logo-png.py
      - name: Verificar sintaxe e identidade
        run: |
          node --check js/ui/abertura.js
          node tests/siac-identidade.test.cjs
          node tests/siac-independencia.test.cjs
          node tests/siac-titulo-abertura.test.cjs
      - name: Instalar navegador para inspeção da abertura
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Validar aparência do card Laboratório nos temas escuro e claro
        run: node tests/siac-home-browser.cjs
      - name: Verificar abertura real no navegador e salvar quadros
        run: node scripts/siac-validar-v4.cjs
      - name: Preservar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siac-abertura-evidencias
          path: docs/evidencias/siac-abertura/
          retention-days: 14
          if-no-files-found: warn
      - name: Publicar derivados PWA do símbolo aprovado
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/siac-experiencia-didatica'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icones/icone-192.png assets/icones/icone-512.png assets/icones/icone-maskable-512.png assets/icones/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(siac): gerar ícones PWA a partir da identidade oficial"
            for tentativa in 1 2 3; do
              git fetch origin "refs/heads/${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            done
            echo "Falha ao publicar PNGs PWA após três tentativas" >&2
            exit 1
          fi
