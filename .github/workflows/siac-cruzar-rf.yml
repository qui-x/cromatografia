name: "SIAC — Cruzamento de bases de Rf"
on:
  push:
    branches: [feat/siac-motor-cromatografico]
    paths:
      - "scripts/siac-cruzar-rf.py"
      - ".github/workflows/siac-cruzar-rf.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cruzar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências científicas
        run: pip install rdkit pandas openpyxl requests
      - name: Baixar e cruzar por estrutura
        run: python -u scripts/siac-cruzar-rf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siac-cruzamento-rf
          path: docs/evidencias/siac-rf-cross/
          if-no-files-found: warn
          retention-days: 30
